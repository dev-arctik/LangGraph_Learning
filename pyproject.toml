[project]
name = "langgraph-learning"
version = "0.1.0"
description = "I am making the files as I learn new concepts of langgraph"
authors = [
    {name = "Devansh",email = "devansh.arctikcircle@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "langgraph (>=0.5.2,<0.6.0)",
    "langchain (>=0.3.26,<0.4.0)",
    "langchain-openai (>=0.3.27,<0.4.0)",
    "langchain-core (>=0.3.68,<0.4.0)",
    "langchain-community (>=0.3.27,<0.4.0)",
    "motor (>=3.7.1,<4.0.0)",
    "pydantic (>=2.11.7,<3.0.0)",
    "langgraph-checkpoint-mongodb (>=0.1.4,<0.2.0)",
    "python-dotenv (>=1.1.1,<2.0.0)",
    "pillow (>=11.3.0,<12.0.0)",
    "langchain-tavily (>=0.2.7,<0.3.0)",
    "wikipedia (>=1.4.0,<2.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
